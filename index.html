<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeaderHawk Ultimate</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0b1120; --panel: #1e293b; --text: #e2e8f0; --accent: #3b82f6; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;}
        * { box-sizing: border-box; }
        html { overflow-x: hidden; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden;}

        .header-title { font-size: 2rem; font-weight: 800; color: var(--accent); margin-bottom: 10px; text-shadow: 0 0 15px rgba(59,130,246,0.5); text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; text-align: center; font-size: 14px;}

        .scan-box { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 30px;}
        @media(min-width: 600px) { .scan-box { flex-direction: row; } }
        .scan-box input { flex: 1; padding: 15px 20px; border-radius: 8px; border: 1px solid #475569; background: var(--panel); color: white; outline: none; font-size: 16px; width: 100%;}
        .scan-box button { padding: 15px 25px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; width: 100%;}
        @media(min-width: 600px) { .scan-box button { width: auto; } }
        .scan-box button:hover { background: #2563eb; transform: translateY(-2px); }

        /* FIX: dulu ada dua 'display' sehingga panel kosong tampil sebelum scan */
        #result-container { display: none; width: 100%; max-width: 1000px; flex-direction: column; gap: 20px; }

        .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; width: 100%;}
        @media (min-width: 768px) { .dashboard-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); } }
        .dashboard-grid > * { min-width: 0; }

        .card { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; min-width: 0; overflow: hidden;}
        .card h3 { margin-top: 0; color: #94a3b8; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}

        .chart-container { position: relative; height: 200px; width: 100%; display: flex; justify-content: center; }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
        .score-text h1 { margin: 0; font-size: 3rem; color: white; }
        .score-text p { margin: 0; font-size: 1.2rem; font-weight: bold; }

        .info-list p { margin: 10px 0; font-size: 14px; border-bottom: 1px solid #334155; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; word-break: break-word;}
        .info-list span { color: #94a3b8; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; white-space: nowrap; margin-left: 10px;}
        .badge.green { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.red { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge.yellow { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        .ai-section { margin-top: 20px; }
        .ai-hint { color: #94a3b8; font-size: 13px; margin: 0 0 8px; }
        .ai-pass { width: 100%; padding: 12px 14px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: var(--bg); color: white; font-size: 16px; outline: none; }
        .btn-ai { background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.2s;}
        .btn-ai:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; transform: none;}

        /* FIX: pre-wrap dihapus karena markdown yang sudah jadi HTML bikin jarak baris ganda */
        .ai-output { background: #0b1120; padding: 15px; border-radius: 8px; border: 1px solid var(--accent); margin-top: 15px; display: none; line-height: 1.6; font-size: 14px; width: 100%; overflow-x: auto; overflow-wrap: anywhere;}
        .ai-output p { margin-top: 0; margin-bottom: 10px; }
        .ai-output pre { background: #000; padding: 15px; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; max-width: 100%; white-space: pre; }
        .ai-output code { font-family: monospace; }

        .loader { border: 4px solid #334155; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 767px) {
            body { padding: 12px; }
            .header-title { font-size: 1.5rem; }
            .card { padding: 14px; }
            .chart-container { height: 180px; }
        }
    </style>
</head>
<body>

    <div class="header-title">🦅 HeaderHawk Ultimate</div>
    <div class="subtitle">Advanced Security Headers, IP Geolocation, & VirusTotal Scanner with AI Auto-Fix</div>

    <div class="scan-box">
        <input type="text" id="url-input" placeholder="Masukkan URL (contoh: github.com)">
        <button id="scan-btn"><i class="fa-solid fa-magnifying-glass"></i> Scan</button>
    </div>

    <div class="loader" id="loader"></div>

    <div id="result-container">
        <div class="dashboard-grid">
            <div style="display: flex; flex-direction: column; gap: 20px; min-width: 0;">
                <div class="card">
                    <h3>Security Score</h3>
                    <div class="chart-container">
                        <canvas id="scoreChart"></canvas>
                        <div class="score-text">
                            <h1 id="score-val">0</h1>
                            <p id="grade-val">F</p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <h3>Server Info & IP-DB</h3>
                    <div class="info-list" id="ip-info-box"></div>
                </div>
                <div class="card">
                    <h3>VirusTotal Reputation</h3>
                    <div id="vt-info-box" style="font-weight: bold; font-size: 14px; line-height: 1.5;"></div>
                </div>
            </div>

            <div class="card">
                <h3>Header Analysis</h3>
                <div class="info-list" id="headers-box"></div>

                <div class="ai-section">
                    <p class="ai-hint"><i class="fa-solid fa-lock"></i> Fitur AI dikunci supaya kuota tidak habis. Minta password ke pemilik proyek.</p>
                    <input type="password" id="ai-password" class="ai-pass" placeholder="Password fitur AI" autocomplete="off" maxlength="128">
                    <button class="btn-ai" id="btn-ai"><i class="fa-solid fa-robot"></i> Minta Analisis & Perbaikan AI</button>
                    <div class="ai-output" id="ai-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
